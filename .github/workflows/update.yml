name: Daily Manga Mapping Update

on:
  schedule:
    # Run daily at 03:00 UTC (after MangaBaka's daily dump publishes)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-generation even if timestamp is unchanged'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-mappings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build & Run Mapping Generator
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          cargo run --release -- $FORCE_FLAG

      - name: Check for changes
        id: git-check
        run: |
          git status
          if [ -n "$(git status --porcelain manga-list-mini.json manga-mapping-flat.json timestamp.txt)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manga-list-mini.json manga-list-mini.json.gz manga-mapping-flat.json timestamp.txt
          TIMESTAMP=$(cat timestamp.txt 2>/dev/null || date -u +"%Y-%m-%d %H:%M:%S")
          git commit -m "chore(data): update manga mappings [$TIMESTAMP] [skip ci]"
          git push origin main
